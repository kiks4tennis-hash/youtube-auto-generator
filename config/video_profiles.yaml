# =========================================================
# 動画プロファイル設定
# レンダラーはこの設定を動的に読み込む
# =========================================================

short:
  video_type: short
  width: 1080
  height: 1920
  fps: 30
  video_preset: medium
  video_crf: 23
  duration: 45              # 目安秒数（実際は音声長に合わせて可変）
  min_duration: 30
  max_duration: 60
  font_size: 88
  # font_path: assets/fonts/NotoSansJP-Bold.ttf
  font_path: /usr/share/fonts/truetype/noto/NotoSans-Regular.ttf
  phrase_font_color: "#FFFFFF"
  example_font_color: "#FFD54A"
  background_music: assets/bgm/short_bgm.mp3
  bgm_volume: 0.12
  subtitle_position: bottom
  phrases_per_video: 1

long:
  video_type: long
  width: 1920
  height: 1080
  fps: 30
  video_preset: medium
  video_crf: 23
  duration: 600             # 目安秒数（実際は音声長に合わせて可変）
  min_duration: 300
  max_duration: 900
  font_size: 76
  # font_path: assets/fonts/NotoSansJP-Bold.ttf
  font_path: /usr/share/fonts/truetype/noto/NotoSans-Regular.ttf
  phrase_font_color: "#FFFFFF"
  example_font_color: "#FFD54A"
  background_music: assets/bgm/long_bgm.mp3
  bgm_volume: 0.10
  subtitle_position: bottom
  phrases_per_video: 20
  min_phrases_per_video: 15
  max_phrases_per_video: 30
  intro_seconds: 5
  outro_seconds: 8
  review_segment: true
